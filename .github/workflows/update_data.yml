name: Update Athlete Data

on:
  schedule:
    # Runs at 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch:
    # Also allows manual trigger from GitHub Actions UI

jobs:
  update-athletes:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated JSON back

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper (dry-run check)
        id: dry_run
        run: |
          python3 scripts/scrape_rankings.py --dry-run 2>&1 | tail -5
        continue-on-error: true

      - name: Scrape World Aquatics rankings
        run: |
          python3 scripts/scrape_rankings.py
        env:
          # Increase timeout tolerance for slow network in CI
          PYTHONUNBUFFERED: "1"

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet js/data/athletes.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data/athletes.json
          git commit -m "chore: auto-update athlete data $(date -u '+%Y-%m-%d')"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "athletes.json is already up to date — no commit needed."

      - name: Run back-test (informational)
        run: |
          python3 scripts/backtest.py --year both
        continue-on-error: true
